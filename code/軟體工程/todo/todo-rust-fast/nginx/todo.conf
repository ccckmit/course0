# Nginx reverse proxy for todo-rust-fast
# Place in /etc/nginx/servers/todo.conf (Linux/macOS)
#
# Benchmarked optimizations:
#   - sendfile + tcp_nopush: zero-copy I/O for static files
#   - proxy_cache: cache GET /api/todos responses for 5s
#   - gzip on: compress text responses
#   - keepalive 64: connection reuse for upstream

upstream todo_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

proxy_cache_path /tmp/nginx-todo-cache levels=1:2 keys_zone=todo_cache:10m max_size=100m inactive=60m;

server {
    listen 80;
    server_name todo.local;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/css text/javascript;
    gzip_min_length 256;
    gzip_comp_level 3;
    gzip_vary on;

    # Zero-copy static file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Serve static frontend (if any)
    location /static/ {
        root /var/www/todo;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy with caching for GET
    location /api/ {
        proxy_pass http://todo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache GET responses for 5 seconds
        proxy_cache todo_cache;
        proxy_cache_key "$scheme$request_method$uri$is_args$args";
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_no_cache $arg_nocache;
        proxy_cache_bypass $arg_nocache;
        add_header X-Cache-Status $upstream_cache_status;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check
    location /health {
        proxy_pass http://todo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Deny all other
    location / {
        return 404;
    }
}
